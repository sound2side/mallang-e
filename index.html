<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>MALLANG-E</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one centred column. Name, then the rounded-rectangle handheld, then module tray, live control map and saved residents */
:root{
  --bg:#fff6f4; --fg:#3b2a33; --muted:#8b7380; --line:#f2d8e0; --panel:#ffffff; --accent:#ff6f9c; --accent-soft:#ffe3ec; --warn:#d6485a;
  --display:"Silkscreen", "Courier New", monospace;
  --body:"Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  /* device: team model, default grey shell */
  --shell:#cfcdca; --shell-dk:#b9b7b4; --shell-hi:#e3e1df; --bezel:#2a2928; --knob:#dcdad7; --knob-hi:#f4f3f1; --knob-dk:#bfbdba; --tbg:#e3e1df; --tink:#2a2928; --back:#a6a39f; --back-dk:#94918d; --back-hi:#b3b0ad;
  --lcd:#b9c6a2; --lcd-ink:#2a3620; --lcd-mid:#7f8f68;
  --part:#fffaf2; --part-dk:#eedfd0; --part-sh:#d9bfae; --squish:#ecc99c; --squish-dk:#d3a672; --sock:#c3c1be; --lbl:#6f6c69;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#231a1f; --fg:#f7eaef; --muted:#c1a7b3; --line:#3f2c36; --panel:#2e2229; --accent:#ff8fb3; --accent-soft:#4a2a38; --warn:#ff8a8a; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#231a1f; --fg:#f7eaef; --muted:#c1a7b3; --line:#3f2c36; --panel:#2e2229; --accent:#ff8fb3; --accent-soft:#4a2a38; --warn:#ff8a8a; color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.85;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px 56px}
.wrap{max-width:560px;margin:0 auto;display:grid;gap:48px;text-align:center}
header{display:grid;justify-items:center;gap:4px}
.eyebrow{font-family:var(--display);font-size:11px;letter-spacing:.14em;color:var(--accent);text-transform:uppercase;
  background:var(--accent-soft);border-radius:999px;padding:4px 12px}
h1{font-family:var(--body);font-weight:700;font-size:13px;letter-spacing:.06em;line-height:1.4;margin:0;text-wrap:balance}
h1 small{display:block;font-family:var(--display);font-weight:400;font-size:.36em;letter-spacing:.12em;color:var(--accent);margin-top:6px}
header p{margin:0;color:var(--muted);font-size:11px;line-height:1.7;max-width:40ch;text-wrap:balance}

/* ---------- device: team model. rounded slab, big screen, control bar (grille, LEDs, green button), two module sockets ---------- */
.stage{display:grid;grid-template-columns:1fr minmax(0,340px) 1fr;align-items:center;gap:14px}
.stage .device{grid-column:2}.stage .swrow{grid-column:3;justify-self:start}
.device{container-type:inline-size;width:100%;min-width:0;perspective:260cqw}
.spin{position:relative;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,1.25,.5,1)}
.spin.dragging{transition:none}
.slab{position:absolute;inset:0;border-radius:11cqw;background:var(--shell-dk);pointer-events:none;box-shadow:inset 0 0 0 .3cqw rgba(0,0,0,.06)}
.back{position:absolute;inset:0;border-radius:11cqw;padding:1.6cqw;transform:translateZ(-7cqw) rotateY(180deg);backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:linear-gradient(180deg,var(--shell-hi),var(--shell) 35%,var(--shell-dk));touch-action:pan-y;cursor:grab}
.back .panel{height:100%;border-radius:9.6cqw;
  background:linear-gradient(180deg,var(--back) 0%,var(--back) 33%,var(--back-dk) 41%,var(--back-hi) 47%,var(--back) 54%,var(--back) 100%);
  box-shadow:inset 0 .6cqw 1.2cqw rgba(0,0,0,.25),inset 0 -.4cqw .8cqw rgba(255,255,255,.12)}
.shell{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.bezel{touch-action:pan-y;cursor:grab}
.spin.dragging .bezel,.spin.dragging .back{cursor:grabbing}
.shell{position:relative;width:100cqw;aspect-ratio:1/1.4;border-radius:11cqw;padding:1.6cqw;
  background:linear-gradient(180deg,var(--shell-hi),var(--shell) 35%,var(--shell-dk));
  box-shadow:0 3cqw 7cqw rgba(0,0,0,.16),0 .6cqw 1.4cqw rgba(0,0,0,.1)}
.device.rumble .shell{animation:buzz .12s linear infinite}
.device.buzz .shell{animation:buzz .18s linear}
@keyframes buzz{0%,100%{transform:translate(0,0)}20%{transform:translate(-.6cqw,.2cqw)}40%{transform:translate(.6cqw,-.2cqw)}60%{transform:translate(-.4cqw,.3cqw)}80%{transform:translate(.4cqw,-.1cqw)}}
.front{position:relative;height:100%;border-radius:9.6cqw;background:var(--shell);padding:4.4cqw 4.4cqw 0;
  display:grid;grid-template-rows:60cqw 11cqw 1fr;gap:3.6cqw;box-shadow:inset 0 .4cqw .6cqw rgba(255,255,255,.3),inset 0 -.4cqw .8cqw rgba(0,0,0,.08)}
.bezel{background:var(--bezel);border-radius:5cqw;padding:1.4cqw;box-shadow:inset 0 .6cqw 1.2cqw rgba(0,0,0,.6),0 .3cqw 0 rgba(255,255,255,.25);min-height:0}
.lcd{height:100%;background:var(--lcd);border-radius:3.6cqw;padding:1.6cqw 2.4cqw;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:.8cqw;
  color:var(--lcd-ink);text-align:left;box-shadow:inset 0 0 2cqw rgba(0,0,0,.25);font-family:var(--display);font-size:3cqw;line-height:1}
.strip{display:flex;justify-content:space-between;gap:2cqw;white-space:nowrap;overflow:hidden}
.strip.bottom{color:var(--lcd-mid);font-size:2.6cqw}
.screen{position:relative;height:100%;aspect-ratio:64/48;justify-self:center;min-height:0}
.screen canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,rgba(185,198,162,.35) 0 1px,transparent 1px calc(100%/64)),
             repeating-linear-gradient(0deg,rgba(185,198,162,.35) 0 1px,transparent 1px calc(100%/48))}
.bar{display:flex;align-items:center;gap:2cqw;padding:0 1.2cqw;border-radius:5.5cqw;background:var(--sock);
  box-shadow:inset 0 .5cqw 1cqw rgba(0,0,0,.16),0 .3cqw 0 rgba(255,255,255,.35)}
.grille{width:38cqw;height:8cqw;border-radius:4cqw;background-color:rgba(0,0,0,.28);
  background-image:radial-gradient(circle,rgba(0,0,0,.45) 38%,transparent 44%);background-size:1.1cqw 1.1cqw;box-shadow:inset 0 .4cqw .6cqw rgba(0,0,0,.25)}
.leds{display:flex;align-items:center;gap:1.7cqw;margin-left:auto}
.leds i{width:1.6cqw;height:1.6cqw;border-radius:1cqw;background:#fff;box-shadow:0 0 1cqw rgba(255,255,255,.9);transition:opacity .2s}
.leds i:last-child{width:3.2cqw}
.bar.mute .leds i{opacity:.2;box-shadow:none}
.power{width:9cqw;height:9cqw;border-radius:50%;border:none;padding:0;cursor:pointer;flex:none;
  background:radial-gradient(circle at 40% 35%,#58c068,#2c8d3c 60%,#1e6a2c);box-shadow:0 .5cqw .8cqw rgba(0,0,0,.28),inset 0 -.4cqw .6cqw rgba(0,0,0,.2);transition:filter .2s,transform .1s}
.power:active{transform:scale(.92)}
.bar.mute .power{filter:saturate(.15) brightness(.85)}
.power:focus-visible{outline:.6cqw solid var(--accent);outline-offset:.4cqw}
.tag{position:absolute;left:50%;transform:translateX(-50%);top:1.4cqw;z-index:1;font-family:var(--body);font-size:3cqw;font-weight:700;line-height:1;color:var(--lcd-ink);background:var(--lcd);border:.4cqw solid var(--lcd-ink);border-radius:1cqw;padding:.9cqw 1.6cqw .8cqw;max-width:62%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag:empty{display:none}

.controls{position:relative;width:100%;height:100%}
.sockwrap{position:absolute;top:6.6cqw}
.sockwrap[data-slot="0"]{left:2cqw}
.sockwrap[data-slot="1"]{right:2cqw}
.socket{position:relative;width:36cqw;height:36cqw;border-radius:50%;display:grid;place-items:center;background:var(--shell);
  box-shadow:inset 0 .5cqw 1cqw rgba(0,0,0,.14),inset 0 -.3cqw .6cqw rgba(255,255,255,.35),0 0 0 .35cqw var(--sock)}
.socket.empty .plus{font-family:var(--display);font-size:7cqw;color:var(--lbl);opacity:.5;pointer-events:none}
.socket.over{box-shadow:inset 0 1cqw 2cqw rgba(0,0,0,.2),0 0 0 1.2cqw rgba(255,111,156,.45)}
.controls.full .socket{animation:nope .3s}
@keyframes nope{25%{transform:translateX(-1cqw)}75%{transform:translateX(1cqw)}}
.eject{position:absolute;right:0;top:0;width:6.5cqw;height:6.5cqw;border-radius:50%;border:none;cursor:pointer;z-index:2;opacity:.75;
  background:#1f1e1d;color:#fff;font-family:var(--display);font-size:3.2cqw;line-height:1;display:grid;place-items:center;padding:0;box-shadow:0 .5cqw 1cqw rgba(0,0,0,.3)}
.eject:hover{opacity:1}
.eject:focus-visible{outline:.6cqw solid var(--accent);outline-offset:.4cqw}
.lbl{display:none}
.mod{animation:pop .32s cubic-bezier(.3,1.7,.5,1)}
@keyframes pop{from{transform:scale(.55);opacity:.3}to{transform:scale(1);opacity:1}}

button{font:inherit;color:inherit}
/* d-pad: green cross */
.dpad{width:31cqw;height:31cqw;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr)}
.dpad button,.dpad .c{border:none;padding:0;background:linear-gradient(180deg,#3fa94d,#2b8a39);box-shadow:0 .9cqw 0 #1d6528,0 1.6cqw 1.8cqw rgba(0,0,0,.2)}
.dpad button{cursor:pointer;touch-action:none}
.dpad button.on{transform:translateY(.6cqw);box-shadow:0 .3cqw 0 #1d6528}
.dpad .u{grid-area:1/2;border-radius:2cqw 2cqw 0 0}.dpad .d{grid-area:3/2;border-radius:0 0 2cqw 2cqw}
.dpad .l{grid-area:2/1;border-radius:2cqw 0 0 2cqw}.dpad .r{grid-area:2/3;border-radius:0 2cqw 2cqw 0}
.dpad .c{grid-area:2/2;background:radial-gradient(circle,#2a8537 0 38%,#36a045 60%,#2f9140)}
.dpad svg{display:none}
/* squishy: beige donut */
.squish{width:30cqw;height:30cqw;border-radius:50%;border:none;cursor:pointer;touch-action:none;
  background:radial-gradient(circle,var(--squish-dk) 0 14%,var(--squish) 32%,#f8ead6 52%,var(--squish) 72%,var(--squish-dk) 100%);
  box-shadow:inset 0 -1.4cqw 2cqw rgba(130,95,55,.22),0 1.4cqw 2.4cqw rgba(0,0,0,.18);transition:transform .35s cubic-bezier(.3,1.8,.5,1)}
.squish.down{transform:scale(1.12,.8);transition:transform .5s ease-out}
/* dial: raised disc with blue dot */
.rotary{border-radius:50%;position:relative;cursor:grab;touch-action:none}
.rotary .face{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 40% 30%,var(--knob-hi) 0%,var(--knob) 60%,var(--knob-dk) 100%);
  box-shadow:0 1.4cqw 2.4cqw rgba(0,0,0,.28),inset 0 -.6cqw 1cqw rgba(0,0,0,.1),inset 0 .4cqw .6cqw rgba(255,255,255,.4);transition:transform .12s ease-out}
.rotary .face::after{content:"";position:absolute;left:24%;top:56%;width:28%;height:28%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#2f62b8,#1d468f 70%);box-shadow:inset 0 .3cqw .5cqw rgba(0,0,0,.25)}
.dial{width:32cqw;height:32cqw}.knob{width:20cqw;height:20cqw}
.rotary:focus-visible,.squish:focus-visible,.joy:focus-visible,.clicker:focus-visible,.dpad button:focus-visible{outline:.6cqw solid var(--accent);outline-offset:.5cqw}
/* joystick: dark stick in a dark well */
.joy{width:30cqw;height:30cqw;border-radius:50%;border:none;padding:0;position:relative;touch-action:none;cursor:grab;
  background:radial-gradient(circle,#161616 0 62%,#3b3b3b 66%,#262626 100%);box-shadow:0 .8cqw 1.4cqw rgba(0,0,0,.25)}
.joy .stick{position:absolute;left:50%;top:50%;width:19cqw;height:19cqw;margin:-9.5cqw 0 0 -9.5cqw;border-radius:50%;
  background:radial-gradient(circle at 45% 38%,#555 0%,#383838 55%,#262626 100%);box-shadow:0 1cqw 1.4cqw rgba(0,0,0,.45),inset 0 .4cqw .6cqw rgba(255,255,255,.12);pointer-events:none;transition:transform .08s}
/* clicker: dark pill with grey and red caps */
.clicker{position:relative;width:31cqw;height:12cqw;border-radius:6cqw;border:none;cursor:pointer;touch-action:none;padding:0;
  background:#2b2a29;box-shadow:inset 0 .5cqw .8cqw rgba(0,0,0,.5),0 .3cqw 0 rgba(255,255,255,.25)}
.clicker::before,.clicker::after{content:"";position:absolute;top:1.3cqw;width:9.4cqw;height:9.4cqw;border-radius:50%;transition:transform .08s}
.clicker::before{left:1.3cqw;background:radial-gradient(circle at 40% 35%,#c9c7c4,#9e9c99 70%);box-shadow:0 .5cqw .8cqw rgba(0,0,0,.4)}
.clicker::after{right:1.3cqw;background:radial-gradient(circle at 40% 35%,#d0603f,#a53d22 70%);box-shadow:0 .5cqw .8cqw rgba(0,0,0,.4)}
.clicker.on::before,.clicker.on::after{transform:scale(.9)}

/* ---------- panels ---------- */
section{display:grid;justify-items:center;gap:16px}
section h2{font-family:var(--body);font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin:0;color:var(--accent)}
section h2 span{font-family:var(--body);font-weight:700;font-size:16px;letter-spacing:0;text-transform:none;color:var(--fg);margin-right:6px}
.namebox{display:flex;gap:8px;align-items:center;width:min(100%,320px)}
#nameIn{flex:1;min-width:0;font-family:var(--body);font-size:17px;text-align:center;padding:8px 4px;
  border:none;border-bottom:2px solid var(--line);border-radius:0;background:transparent;color:var(--fg);transition:border-color .15s}
#nameIn::placeholder{color:var(--muted)}
#nameIn:focus-visible{outline:none;border-bottom-color:var(--accent)}
.count{font-family:var(--body);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.side{display:grid;gap:48px}
.view{display:grid;gap:48px}
.tabs{display:flex;justify-content:center;gap:4px;margin-top:-24px;padding:4px;border-radius:999px;background:var(--panel);border:1px solid var(--line);justify-self:center}
.tabs button{border:none;background:transparent;padding:7px 18px;border-radius:999px;font-family:var(--body);font-size:14px;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:#fff}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.plaza{display:grid;gap:14px;justify-items:center}
.pbtns{display:flex;gap:8px}
.pbtns button{font-family:var(--body);font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:8px 16px;border-radius:999px;cursor:pointer}
.pbtns button.rec{background:#ff4d6d;color:#fff;border-color:#ff4d6d}
.pbtns button:disabled{opacity:.6;cursor:default}
.pbtns button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.plaza canvas{display:block;width:100%;aspect-ratio:520/420;border-radius:28px;cursor:pointer;touch-action:manipulation;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.swrow{display:grid;justify-items:center;gap:8px;align-content:center}
.swrow>span{font-family:var(--body);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sws{display:flex;flex-direction:column;align-items:center;gap:8px}
@media (max-width:420px){.stage{gap:8px}.sw{width:22px;height:22px}.sws{gap:6px}}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);padding:0;cursor:pointer;position:relative;transition:transform .12s}
.sw:hover{transform:scale(1.1)}
.sw.on{outline:2px solid var(--accent);outline-offset:2px}
.sw:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sw.custom{background:conic-gradient(#ff8fb3,#ffd66b,#9fe3b8,#9cc9ff,#c7b2ff,#ff8fb3);overflow:hidden}
.sw.custom input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;border:0;padding:0}
.cam{margin-top:10px;width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;display:grid;place-items:center;padding:0;transition:transform .12s}
.cam svg{width:20px;height:20px}
.cam:hover{transform:scale(1.08)}
.cam:active{transform:scale(.92)}
.cam:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tray{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:12px;width:100%}
.card{display:grid;justify-items:center;gap:6px;padding:14px 8px;border:2px solid var(--line);border-radius:18px;background:var(--panel);cursor:grab;min-width:0;
  transition:transform .15s}
.card:hover{transform:translateY(-2px)}
.card svg{width:30px;height:30px}
.card b{font-size:15px;line-height:1.2}
.card span{font-size:12px;color:var(--muted)}
.card.in{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.card.in svg{color:var(--accent)!important}
.card.in span{color:var(--accent);font-weight:700}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tip{font-size:14px;color:var(--muted);margin:0;max-width:40ch;text-wrap:balance}
.headrow{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.map{display:grid;gap:12px;width:100%}
.mrow{display:grid;justify-items:center;gap:6px;padding:14px 16px;border-radius:16px;background:var(--panel);border:2px solid var(--line)}
.mrow b{font-size:15px}
.mrow span{font-size:14px;color:var(--muted)}
.mrow .keys{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-top:2px}
.mrow.miss{border-color:var(--warn);border-style:dashed}
.mrow.miss b,.mrow.miss span{color:var(--warn)}
kbd{font-family:var(--body);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--bg);white-space:nowrap}
.roster{display:grid;grid-template-columns:repeat(auto-fill,96px);justify-content:center;gap:10px;width:100%}
.slot{position:relative;background:var(--tbg);border:2px solid var(--shell-dk);border-radius:14px;padding:6px;cursor:pointer;display:grid;gap:4px;color:var(--tink);font-family:var(--body);font-size:11px}
.modal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:24px 16px;background:rgba(20,30,28,.28);backdrop-filter:blur(3px)}
.rcard{width:min(100%,340px);background:var(--panel);border-radius:28px;padding:32px 28px 24px;display:grid;justify-items:center;gap:14px;
  box-shadow:0 24px 60px rgba(0,0,0,.18);animation:pop .3s cubic-bezier(.3,1.5,.5,1)}
.rcard canvas{width:132px;aspect-ratio:64/48;image-rendering:pixelated;border-radius:16px;background:var(--tbg)}
.rname{font-family:var(--body);font-size:19px;font-weight:700;max-width:100%;overflow-wrap:anywhere;margin-top:2px}
.chip{font-size:12px;background:var(--accent-soft);color:var(--accent);padding:3px 12px;border-radius:999px;margin-top:-6px}
.info{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:10px 0 0;font-size:13px;text-align:left;width:100%;padding-top:16px;border-top:1px solid var(--line)}
.info dt{color:var(--muted)}.info dd{margin:0}
.stats{display:grid;gap:9px;width:100%;padding-top:14px;border-top:1px solid var(--line)}
.stat{display:grid;grid-template-columns:4.5em 1fr;align-items:center;gap:12px;font-size:12px;text-align:left}
.stat span{color:var(--muted)}
.stat i{display:block;height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.stat i b{display:block;height:100%;border-radius:999px;background:var(--accent)}
.mbtns{display:flex;gap:8px;margin-top:10px}
.mbtns button{font-family:var(--body);font-size:13px;border:none;cursor:pointer;padding:9px 18px;border-radius:999px;background:var(--fg);color:var(--panel)}

.screen,.screen *,.lcd,.lcd *{font-family:"Silkscreen","Gowun Dodum","Apple SD Gothic Neo",monospace!important}

<script>
(()=>{
const W=64,H=48;
const CATS=[
  {id:'face',label:'FACE',n:16,names:['ROUND','SQUARE','EGG','V-CHIN','WIDE','LONG','SOFT SQUARE','DIAMOND','HEART','PEAR','MOCHI','BEAN','RECTANGLE','CHUBBY','ONION','HEXAGON']},
  {id:'hair',label:'HAIR',n:27,names:['NONE','BOWL','SPIKY','LONG','BUN','CAT EARS','SWEEP','SPACE BUNS','PIGTAILS','PONYTAIL','CURLY','HIME','SPROUT','MOHAWK','BEANIE','BRAIDS','CURTAIN','SEE-THRU','WAVY','HIGH PONY','SIDE BOB','LOW BRAIDS','HALF-UP','LAYERED','ONE HAIR','TWO HAIRS','BALD+1']},
  {id:'eyes',label:'EYES',n:18,names:['DOT','BIG','CALM','HAPPY','SLEEPY','SPARK','TALL','WINK','SHINY','ANGRY','SAD','DIZZY','HEART','LASHES','TINY','WOW','BROWS','X X']},
  {id:'mouth',label:'MOUTH',n:18,names:['SMILE','FLAT','OH','CAT','GRIN','POUT','TONGUE','TEETH','DOT','CAT SMILE','SMIRK','WOBBLY','SCREAM','KISS','FANGS','BUCK TEETH','LINE','FROWN']},
  {id:'extra',label:'FACE+',n:16,names:['NONE','BLUSH','GLASSES','FRECKLES','MOUSTACHE','GOATEE','BEARD','STUBBLE','CURLY STACHE','MOLE','BANDAGE','SCAR','TEAR','SWIRLS','NOSE','SUNGLASSES']},
  {id:'acc',label:'ACC',n:19,names:['NONE','CROWN','PARTY HAT','CAP','BERET','TOP HAT','BUNNY EARS','HEADPHONES','HALO','FLOWER','RIBBON','STAR CLIP','HEART CLIP','FLOWER CROWN','HEADBAND','WITCH HAT','LEAF','GOGGLES','CAT BAND']},
  {id:'height',label:'HEIGHT',n:5,names:['XS','S','M','L','XL']},
  {id:'width',label:'WIDTH',n:5,names:['SLIM','LEAN','REGULAR','ROUND','CHUBBY']},
  {id:'pet',label:'PET',n:7,names:['NONE','DOG','CAT','BIRD','HAMSTER','FISH','RABBIT']},
  {id:'psize',label:'PET SIZE',n:2,names:['SMALL','BIG']},
  {id:'pcoat',label:'PET COAT',n:4,names:['WHITE','GREY','BLACK','SPOTS']},
  {id:'pfeat',label:'PET+',n:2,names:['A','B']},
];
const def={face:0,hair:1,eyes:0,mouth:0,extra:1,acc:0,height:2,width:2,pet:0,psize:0,pcoat:0,pfeat:0,eyeY:0,eyeSp:0,mouthY:0,extraY:0};
let st={...def}; let ci=1;

const MODS={
  dpad:{ko:'십자키',en:'D-PAD',keys:['←','↑','→','↓'],icon:'<path d="M12 3h6v9h9v6h-9v9h-6v-9H3v-6h9z" fill="#2f8f3d" stroke="#1d6528" stroke-width="1" stroke-linejoin="round"/>'},
  joy:{ko:'조이스틱',en:'STICK',keys:['W','A','S','D'],icon:'<circle cx="15" cy="15" r="13" fill="#262626"/><circle cx="15" cy="15" r="8" fill="#4a4a4a"/>'},
  dial:{ko:'다이얼',en:'DIAL',keys:['Q','E'],icon:'<circle cx="15" cy="15" r="13" fill="#dcdad7" stroke="#b5b3b0"/><circle cx="11" cy="19" r="3.8" fill="#1f4b96"/>'},
  knob:{ko:'노브',en:'KNOB',keys:['R','F'],icon:'<circle cx="15" cy="15" r="8" fill="currentColor"/><rect x="14" y="4" width="2" height="6" fill="currentColor"/>'},
  click:{ko:'클리커',en:'CLICK',keys:['Space'],icon:'<rect x="2" y="9" width="26" height="12" rx="6" fill="#2b2a29"/><circle cx="8" cy="15" r="4.2" fill="#a9a7a4"/><circle cx="22" cy="15" r="4.2" fill="#b8452a"/>'},
  squish:{ko:'말랑 버튼',en:'SQUISHY',keys:['X 꾹'],icon:'<circle cx="15" cy="15" r="13" fill="#ecc99c"/><circle cx="15" cy="15" r="8" fill="#f8ead6"/><circle cx="15" cy="15" r="4" fill="#d3a672"/>'},
};
const ORDER=['squish','dial','dpad','click','joy'];

/* ---------- storage ---------- */
const KEY='resident-maker-v1',LKEY='resident-maker-loadout2';
let roster=[],slots=['squish','dial'];
try{roster=JSON.parse(localStorage.getItem(KEY)||'[]')||[]}catch(e){roster=[]}
try{const l=JSON.parse(localStorage.getItem(LKEY)||'null');if(Array.isArray(l)&&l.length===2)slots=l.map(x=>ORDER.includes(x)?x:null)}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(roster))}catch(e){}}
function persistLoad(){try{localStorage.setItem(LKEY,JSON.stringify(slots))}catch(e){}}
if(!roster.length){roster=[
  {name:'NO.1',s:{...def,face:0,hair:5,eyes:1,mouth:3,extra:1,acc:9,pet:1,psize:1,pcoat:3,pfeat:1}},
  {name:'NO.2',s:{...def,face:2,hair:8,eyes:3,mouth:0,extra:2,height:3,acc:1,pet:2,psize:0,pcoat:2,pfeat:0}},
  {name:'NO.3',s:{...def,face:1,hair:2,eyes:4,mouth:1,extra:3,width:3,height:1}}]}
/* ---------- random personality, like a village resident ---------- */
const TR={
  p:['느긋','먹보','아이돌','운동광','새침','무뚝뚝','다정','장난꾸러기','몽상가','수다쟁이'],
  h:['낚시','음악 듣기','패션','낮잠','산책','그림 그리기','요리','별 보기','게임','수집'],
  l:['딸기 우유','말랑이','비 오는 날','고양이','붕어빵','반짝이는 것','라디오','구름','떡볶이','작은 화분'],
  c:['말랑~','뿅뿅','딸깍!','냠냠','그치?','헤헤','우왕','쿨쿨','반짝','요호'],
  st:['말랑함','활발함','호기심','졸림']};
const pick=a=>a[Math.floor(Math.random()*a.length)];
function genTraits(){return{p:pick(TR.p),h:pick(TR.h),l:pick(TR.l),c:pick(TR.c),b:[1+Math.floor(Math.random()*12),1+Math.floor(Math.random()*28)],st:TR.st.map(()=>1+Math.floor(Math.random()*5))}}
const newId=()=>'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
roster.forEach(r=>{if(!r.t)r.t=genTraits();if(!r.id)r.id=newId()});persist();
let meId=null;try{meId=localStorage.getItem('rm-me')}catch(e){}


/* ---------- sound ---------- */
let ac=null,soundOn=true;
function blip(f=880,d=.04,type='square',v=.05){
  if(!soundOn)return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);
    o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d+.02)}catch(e){}
}
/* each module has its own voice */
function getAC(){ac=ac||new (window.AudioContext||window.webkitAudioContext)();return ac}
function sweep(f1,f2,d,type='sine',v=.08,delay=0){if(!soundOn)return;try{const a=getAC(),t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
let nbuf=null;
function noise(d,freq,q=4,v=.25,delay=0){if(!soundOn)return;try{const a=getAC(),t=a.currentTime+delay;
  if(!nbuf){nbuf=a.createBuffer(1,a.sampleRate*.3,a.sampleRate);const c=nbuf.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1}
  const src=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();src.buffer=nbuf;f.type='bandpass';f.frequency.value=freq;f.Q.value=q;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);src.connect(f).connect(g).connect(a.destination);src.start(t);src.stop(t+d+.02)}catch(e){}}
const SFX={
  dpad:d=>{blip(d<0?1250:1050,.025,'square',.035);noise(.02,4000,2,.12)},              // short plastic tick
  joy:d=>{sweep(d<0?340:260,d<0?220:160,.09,'triangle',.1)},                          // soft rubbery thunk
  dial:d=>{noise(.012,d>0?5200:4600,6,.35);blip(d>0?2300:2100,.012,'square',.02)},    // ratchet detent
  knob:d=>{sweep(520,330,.06,'sine',.14);noise(.03,900,3,.15)},                        // deep wooden thock
  clickDown:()=>{noise(.018,3200,8,.5);blip(1800,.01,'square',.03)},                   // crisp click
  clickUp:()=>{noise(.014,2400,8,.25)},
  squishDown:()=>{sweep(480,190,.35,'sine',.09)},                                        // squeeze squeak down
  click:()=>{},
  squish:()=>{sweep(300,640,.09,'sine',.09)},
  squishUp:k=>{sweep(180,520+700*k,.18,'sine',.1);sweep(260,700+500*k,.14,'triangle',.04,.03)}, // boing
};
let curMod=null;
const via=(m,fn)=>(...a)=>{curMod=m;try{fn(...a)}finally{curMod=null}};
const soundBtn=document.getElementById('sound');
function toggleSound(){soundOn=!soundOn;document.getElementById('bar').classList.toggle('mute',!soundOn);document.getElementById('muteSw')?.setAttribute('aria-checked',soundOn);if(soundOn)blip(1200,.04);flash(soundOn?'SOUND ON':'SOUND OFF')}
soundBtn.addEventListener('click',()=>goHome());

/* ---------- drawing ---------- */
const PAL=[[185,198,162],[42,54,32],[127,143,104]];
const EYES=[['11','11'],['111','101','111'],['111'],['.1.','1.1'],['111','.1.'],['.1.','111','.1.'],
  ['1','1','1'],{l:['11','11'],r:['.1.','1.1']},['.11.','1101','1111','.11.'],{l:['1..','.11','.11'],r:['..1','11.','11.']},
  {l:['..1','.1.','11.'],r:['1..','.1.','.11']},['111','1.1','11.'],['1.1','111','.1.'],['1.1.','1111','1111'],['1'],
  ['.1.','1.1','.1.'],['111','...','.1.'],['1.1','.1.','1.1']];
const MOUTH=[['1...1','.111.'],['111'],['.1.','1.1','.1.'],['1.1.1','.1.1.'],['11111','1...1','.111.'],['.111.','1...1'],
  ['1...1','.111.','..2..'],['11111','1.1.1','11111'],['1'],['1..1..1','.11.11.'],['...1','111.'],['.1.1.','1.1.1'],
  ['.111.','1...1','1...1','.111.'],['1.','.1','1.'],['111111','.1..1.'],['11111','.1.1.'],['11111'],['.1.','1.1']];
const BLINK=['111'],SQ_L=['1..','.1.','1..'],SQ_R=['..1','.1.','..1'],HAPPY=['.1.','1.1'];

function render(buf,s,o){
  buf.fill(0);
  const set=(x,y,v)=>{x|=0;y|=0;if(x>=0&&x<W&&y>=0&&y<H)buf[y*W+x]=v};
  const pat=(p,cx,cy)=>{const h=p.length,w=p[0].length,ox=Math.round(cx-(w-1)/2),oy=Math.round(cy-(h-1)/2);
    for(let j=0;j<h;j++)for(let i=0;i<w;i++){const c=p[j][i];if(c!=='.')set(ox+i,oy+j,+c)}};
  const sq=o.squish||0,jump=o.jump||0;
  const sc=[.7,.8,.89,.98,1.07][s.height],ws=[.84,.92,1,1.08,1.16][s.width]; // height scales the whole figure
  const rx=10.5*sc*ws*(1+.28*sq),ry=11.5*sc*(1-.33*sq);
  const feet=44-Math.round(jump),cx=(s.pet&&!o.bare)?27:32,cy=feet-7*sc-ry+1.5;

function rasterEl(c,el,base,sx,sy,k){const cs=getComputedStyle(el);if(cs.display==='none'||cs.visibility==='hidden'||el.hidden)return;

  if(!clear(cs.backgroundColor)){c.fillStyle=cs.backgroundColor;rr(c,x,y,w,h,rad);c.fill()}
  const ins=/inset\s+0px\s+0px\s+0px\s+([\d.]+)px/.exec(cs.boxShadow||'')||/rgb[^)]*\)\s+0px\s+0px\s+0px\s+([\d.]+)px\s+inset/.exec(cs.boxShadow||'');

  const ow=(parseFloat(cs.outlineWidth)||0)*k;if(cs.outlineStyle!=='none'&&ow>0){const of=(parseFloat(cs.outlineOffset)||0)*k;c.strokeStyle=cs.outlineColor;c.lineWidth=ow;rr(c,x-of-ow/2,y-of-ow/2,w+2*of+ow,h+2*of+ow,rad+of);c.stroke()}

      const t0=rs[0];c.font=cs.fontWeight+' '+(parseFloat(cs.fontSize)*k)+'px '+cs.fontFamily;c.fillStyle=cs.color;c.textAlign='left';c.textBaseline='middle';
      const words=n.textContent.replace(/\s+/g,' ').trim();if(rs.length===1)c.fillText(words,sx+(t0.left-base.left)*k,sy+(t0.top-base.top+t0.height/2)*k);

    else if(n.nodeType===1)rasterEl(c,n,base,sx,sy,k)}}

  f.sleep=0;f.hopV=220;f.hop=.1;f.heart=1.4;f.wait=1.2;say(f,f.t?.c||'안녕!',1.8);blip(700+Math.random()*400,.06,'triangle',.06);
  tapT={f,id:setTimeout(()=>tapT=null,320)}});
function showView(vw){const pz=vw==='plaza';plazaView.hidden=!pz;setPlay(vw==='play');
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.v===vw)));
  if(pz){buildFolk();if(!pRaf){pLast=performance.now();pRaf=requestAnimationFrame(plazaStep)}}}
/* turn the device around: drag the screen or the back, or press the flip button */
const spin=document.getElementById('spin');let rot=0,tilt=0;
function setRot(anim){spin.classList.toggle('dragging',!anim);spin.style.transform='rotateX('+tilt+'deg) rotateY('+rot+'deg)'}
function snapRot(){rot=Math.round(rot/180)*180;tilt=0;setRot(true)}
document.getElementById('flip').addEventListener('click',()=>{rot=(Math.round(rot/180)+1)*180;tilt=0;setRot(true);sweep(300,700,.25,'triangle',.05)});
[document.querySelector('.bezel'),document.getElementById('back')].forEach(el=>{let g=null;
  el.addEventListener('pointerdown',e=>{g={x:e.clientX,y:e.clientY,r:rot,on:false,id:e.pointerId}});
  el.addEventListener('pointermove',e=>{if(!g)return;const dx=e.clientX-g.x,dy=e.clientY-g.y;
    if(!g.on){if(Math.abs(dx)<6||Math.abs(dx)<Math.abs(dy))return;g.on=true;el.setPointerCapture?.(g.id)}
    rot=g.r+dx*.55;tilt=Math.max(-14,Math.min(14,-dy*.12));setRot(false)});
  const end=()=>{if(g&&g.on)snapRot();g=null};el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end)});
/* share the plaza: photo or short video */
const pShot=document.getElementById('pShot'),pRec=document.getElementById('pRec');
function shutter(){noise(.05,3000,2,.5);noise(.08,1200,2,.3,.07);
  const fl=document.createElement('div');Object.assign(fl.style,{position:'fixed',inset:'0',background:'#fff',zIndex:80,pointerEvents:'none'});document.body.append(fl);
  fl.animate([{opacity:.8},{opacity:0}],{duration:420,easing:'ease-out'}).onfinish=()=>fl.remove()}
const stamp=()=>{const d=new Date(),z=n=>String(n).padStart(2,'0');return d.getFullYear()+z(d.getMonth()+1)+z(d.getDate())+'_'+z(d.getHours())+z(d.getMinutes())};
pShot.addEventListener('click',async()=>{if(!dl)return;pShot.disabled=true;shutter();
  try{const blob=await new Promise(r=>pc.toBlob(r,'image/png'));await dl.save({filename:'plaza_'+stamp()+'.png',data:blob})}
  catch(e){if(e&&['unavailable','not_granted','capability_disabled','capability_removed'].includes(e.code))document.getElementById('pbtns').hidden=true}
  finally{pShot.disabled=false}});
pRec.addEventListener('click',async()=>{if(!dl||pRec.disabled)return;
  if(!pc.captureStream||!window.MediaRecorder){pRec.textContent='영상 미지원';return}
  const type=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));
  if(!type){pRec.textContent='영상 미지원';return}
  const ext=type.startsWith('video/mp4')?'mp4':'webm';
  let rec;try{rec=new MediaRecorder(pc.captureStream(30),{mimeType:type,videoBitsPerSecond:4e6})}catch(e){pRec.textContent='영상 미지원';return}
  const chunks=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  pRec.disabled=true;pRec.classList.add('rec');let left=5;pRec.textContent='● 녹화 중 '+left;blip(880,.08,'sine',.06);
  const iv=setInterval(()=>{left--;if(left>0)pRec.textContent='● 녹화 중 '+left},1000);
  rec.onstop=async()=>{clearInterval(iv);pRec.classList.remove('rec');pRec.textContent='저장 중…';
    try{const blob=new Blob(chunks,{type});await dl.save({filename:'plaza_'+stamp()+'.'+ext,data:blob})}
    catch(e){if(e&&['unavailable','not_granted','capability_disabled','capability_removed'].includes(e.code))document.getElementById('pbtns').hidden=true}
    finally{pRec.disabled=false;pRec.textContent='영상 5초'}};
  rec.start();setTimeout(()=>{try{rec.stop()}catch(e){}},5000)});
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{showView(b.dataset.v);blip(880,.04,'triangle',.05)}));
let sd=null,sb=null;try{sd=localStorage.getItem('rm-dev4');sb=localStorage.getItem('rm-bg')}catch(e){}
applyDevice(sd&&sd!=='#cfcdca'?sd:DEV_SW[0]);
refresh();toast=null;toastT=0;updateStrip();drawRoster();requestAnimationFrame(frame);
})();
</script>
